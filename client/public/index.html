<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Ceylon 1802</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login/Register Screen -->
  <div id="screen-auth" class="screen active">
    <div class="auth-container">
      <h1 class="game-title">Ceylon 1802</h1>
      <p class="subtitle">A Text Adventure in the Age of Spice</p>

      <div id="auth-login" class="auth-panel">
        <input type="email" id="login-email" placeholder="Email" autocomplete="email">
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
        <button id="btn-login" class="btn-primary">Enter Game</button>
        <p class="auth-hint">Need an account? Ask a player to <strong>invite</strong> you.</p>
        <div id="login-error" class="error-msg"></div>
      </div>
    </div>
  </div>

  <!-- Character Select/Create Screen -->
  <div id="screen-character" class="screen">
    <div class="auth-container">
      <h2>Choose Your Character</h2>
      <div id="character-list"></div>

      <div id="character-create-link" style="display:none;margin-top:12px;">
        <button id="btn-show-create" class="btn-link">+ Create New Character</button>
      </div>

      <div id="character-create" class="char-create" style="display:none;">
        <h3>Create New Character</h3>
        <input type="text" id="char-name" placeholder="Character Name (letters only)" maxlength="20">
        <select id="char-background">
          <option value="deckhand">Deckhand — Strong, tough, ready for labor</option>
          <option value="ships_clerk">Ship's Clerk — Smart, perceptive, organized</option>
          <option value="traders_assistant">Trader's Assistant — Charming, sharp, social</option>
          <option value="runaway_apprentice">Runaway Apprentice — Quick, observant</option>
          <option value="farmers_child">Farmer's Child — Tough, strong, hardworking</option>
          <option value="former_soldier">Former Soldier — Strongest fighter start</option>
          <option value="temple_student">Temple Student — Wise, willful, spiritual</option>
          <option value="fishermans_kin">Fisherman's Kin — Perceptive, nimble, fishing gear</option>
        </select>
        <button id="btn-create-char" class="btn-primary">Create Character</button>
        <div id="char-error" class="error-msg"></div>
      </div>

      <button id="btn-logout" class="btn-link">Logout</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="screen-game" class="screen">
    <!-- Top bar: room title + description (tap to collapse) -->
    <div id="top-bar">
      <div id="room-title-box" class="room-title-box">
        <div id="room-title-row" class="room-title-row" title="Click to collapse or expand description">
          <div id="room-title">Ceylon 1802</div>
          <span class="room-title-chevron" aria-hidden="true">▼</span>
        </div>
        <div class="room-desc-row">
          <div id="room-description-text" class="room-description-text"></div>
          <div id="room-compass-mount" class="room-compass-mount" aria-live="polite">
            <button type="button" id="btn-map" class="btn-map" title="Map" aria-label="Map">⊞</button>
          </div>
        </div>
      </div>
      <div id="player-stats" style="display:none">
        <span id="stat-hp" class="stat" title="Health">HP: --</span>
        <span id="stat-sp" class="stat" title="Stamina">SP: --</span>
        <span id="stat-level" class="stat" title="Level">Lv: --</span>
      </div>
    </div>

    <!-- Exit chips -->
    <div id="exits-bar"></div>

    <!-- Map modal (full window) -->
    <div id="map-modal" class="map-modal hidden">
      <button type="button" id="map-modal-close" class="map-modal-close" aria-label="Close">×</button>
      <div id="map-modal-title" class="map-modal-title"></div>
      <div id="map-canvas-wrap" class="map-canvas-wrap">
        <canvas id="map-canvas"></canvas>
      </div>
    </div>

    <!-- Main text output -->
    <div id="game-log"></div>

    <!-- Entities panel -->
    <div id="entities-panel" class="hidden">
      <div id="entities-list"></div>
    </div>

    <!-- Bottom controls -->
    <div id="bottom-controls">
      <!-- Text input -->
      <div id="input-row">
        <input type="text" id="cmd-input" placeholder="Type command..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="btn-send">Send</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
